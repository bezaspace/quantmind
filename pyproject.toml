[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantmind"
version = "0.1.0"
description = "AI-powered quant trading platform for the Indian equity market"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "yfinance>=0.2.40",
    "nse-calendar>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
