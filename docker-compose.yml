version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - quantmind_data:/data
      - ./cache:/root/.quantmind/cache
    command: >
      gunicorn -w 1 -k uvicorn.workers.UvicornWorker quantmind.api:app -b 0.0.0.0:8000

volumes:
  quantmind_data:
