app = "quantmind"
primary_region = "bom"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  QUANTMIND_AUDIT_DB_PATH = "/data/audit.db"

[[mounts]]
  source = "quantmind_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
